version: '3.8'

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
  monitoring-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  db:
    image: postgres:15-alpine
    container_name: booking_db
    restart: always
    environment:
      POSTGRES_DB: booking_tour
      POSTGRES_USER: booking_admin
      POSTGRES_PASSWORD: SecurePassword2026!@#
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network

  webapp:
    image: nginxdemos/hello:plain-text
    container_name: booking_webapp
    restart: always
    networks:
      - frontend-network
      - backend-network

  adminer:
    image: adminer:latest
    container_name: booking_adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - backend-network

  nginx:
    image: nginx:alpine
    container_name: booking_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /var/log/nginx:/var/log/nginx
    networks:
      - frontend-network
      - monitoring-network
    depends_on:
      - webapp

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: booking_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring-network

  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: booking_node_exporter
    restart: always
    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana:10.0.0
    container_name: booking_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring-network
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.8.2
    container_name: booking_loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/tmp/loki
    networks:
      - monitoring-network

  promtail:
    image: grafana/promtail:2.8.2
    container_name: booking_promtail
    restart: always
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/nginx:/var/log/nginx:ro
    networks:
      - monitoring-network
    depends_on:
      - loki
